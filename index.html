    .category-header:hover { background: #0056b3; }
    .items { padding: 15px; display: block; }
    .item { margin-bottom: 12px; word-wrap: break-word; }
    .item a { color: #007bff; text-decoration: none; font-weight: bold; }
    .item a:hover { text-decoration: underline; }
    .description { color: #555; font-size: 0.9em; margin-left: 8px; }
    .no-results { text-align: center; color: #999; font-size: 1.2em; margin: 40px 0; display: none; }
    @media (max-width: 768px) { body { padding: 10px; } #search { font-size: 16px; } }
  </style>
</head>

          {"name": "Passport Photo Maker"},

        ]

    ];

    const searchInput = document.getElementById('search');
    const categoriesDiv = document.getElementById('categories');
    const noResults = document.getElementById('no-results');

    function render() {
      categoriesDiv.innerHTML = '';
      let hasResults = false;
      const searchLower = searchInput.value.toLowerCase().trim();

      toolsData.forEach(cat => {
        const filteredItems = cat.items.filter(item =>
          item.name.toLowerCase().includes(searchLower) ||
          (item.description && item.description.toLowerCase().includes(searchLower)) ||
          cat.category.toLowerCase().includes(searchLower)
        );

        if (filteredItems.length === 0) return;
        hasResults = true;

        const catDiv = document.createElement('div');
        catDiv.className = 'category';

        const header = document.createElement('div');
        header.className = 'category-header';
        header.textContent = `${cat.category} (${filteredItems.length})`;
        header.onclick = () => {
          itemsDiv.style.display = itemsDiv.style.display === 'none' ? 'block' : 'none';
        };

        const itemsDiv = document.createElement('div');
        itemsDiv.className = 'items';
        itemsDiv.style.display = searchLower ? 'block' : 'block';

        filteredItems.forEach(item => {
          const itemDiv = document.createElement('div');
          itemDiv.className = 'item';

          if (item.url) {
            const a = document.createElement('a');
            a.href = item.url;
            a.textContent = item.name;
            a.target = '_blank';
            a.rel = 'noopener';
            itemDiv.appendChild(a);
          } else {
            itemDiv.textContent = item.name;
          }

          if (item.description) {
            const span = document.createElement('span');
            span.className = 'description';
            span.textContent = ' – ' + item.description;
            itemDiv.appendChild(span);
          }

          itemsDiv.appendChild(itemDiv);
        });

        catDiv.appendChild(header);
        catDiv.appendChild(itemsDiv);
        categoriesDiv.appendChild(catDiv);
      });

      noResults.style.display = hasResults ? 'none' : 'block';
    }

    searchInput.addEventListener('input', render);
    render(); // Initial render
  </script>

</html>
