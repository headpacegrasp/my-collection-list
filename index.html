            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        #searchInput {
            width: 100%;
            padding: 15px 50px 15px 20px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: all 0.3s;
        }

        #searchInput:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

		.stats {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
		
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 14px;
        }
		
        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }
		
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #48bb78;
            color: white;
        }

        .btn-secondary:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        }		
		
        .category-filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .category-chip {
            padding: 8px 16px;
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .category-chip:hover {
            background: #edf2f7;
            border-color: #cbd5e0;
        }

        .category-chip.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            display: block;
        }

        .resources-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .resource-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        .resource-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .resource-category {
            display: inline-block;
            padding: 5px 12px;
            background: #edf2f7;
            color: #4a5568;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .resource-title {
            font-size: 18px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .resource-description {
            color: #718096;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .resource-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
        }

        .resource-link {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: #f7fafc;
            border-radius: 6px;
            text-decoration: none;
            color: #667eea;
            font-size: 13px;
            transition: all 0.2s;
            word-break: break-all;
        }

        .resource-link:hover {
            background: #edf2f7;
            color: #5568d3;
        }

        .resource-link::before {
            content: "🔗";
            margin-right: 8px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            color: #2d3748;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #a0aec0;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            color: #4a5568;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
            font-size: 14px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .links-container {
            margin-bottom: 15px;
        }

        .link-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .link-input-group input {
            flex: 1;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 13px;
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover {
            background: #e53e3e;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: white;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .empty-state-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .empty-state-text {
            font-size: 16px;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .resources-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 25px;
            }

            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>


    <div class="container">
        <header>
            <h1>📚 Resource Library</h1>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search resources by title, description, or category...">
                <span class="search-icon">🔍</span>
            </div>

            <div class="controls">
                <button class="btn btn-primary" onclick="openAddModal()">+ Add New Resource</button>
                <button class="btn btn-secondary" onclick="exportData()">⬇ Export Data</button>
                <button class="btn btn-secondary" onclick="document.getElementById(&#39;importFile&#39;).click()">⬆ Import Data</button>
                <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
            </div>
			
            <div class="stats">
                <div class="stat-card">
                    <span class="stat-number" id="totalResources">0</span>
                    <span>Total Resources</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="totalCategories">0</span>
                    <span>Categories</span>
                </div>
            </div>

            <div class="category-filters" id="categoryFilters"></div>


        </header>

        <div class="resources-grid" id="resourcesGrid"></div>

        <div class="empty-state" id="emptyState">
            <div class="empty-state-icon">🔍</div>
            <div class="empty-state-title">No resources found</div>
            <div class="empty-state-text">Try adjusting your search or filters</div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Add New Resource</h2>
                <button class="close-btn" onclick="closeAddModal()">×</button>
            </div>
            
            <form id="resourceForm" onsubmit="saveResource(event)">
                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" required></select>
                </div>

                <div class="form-group">
                    <label for="title">Title *</label>
                    <input type="text" id="title" required>
                </div>

                <div class="form-group">
                    <label for="description">Description *</label>
                    <textarea id="description" required></textarea>
                </div>

                <div class="form-group">
                    <label>Links</label>
                    <div class="links-container" id="linksContainer">
                        <div class="link-input-group">
                            <input type="url" placeholder="https://example.com" class="link-input">
                            <button type="button" class="btn btn-danger btn-small" onclick="removeLink(this)">Remove</button>
                        </div>
                    </div>
                    <button type="button" class="btn btn-secondary btn-small" onclick="addLinkField()">+ Add Another Link</button>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 30px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Save Resource</button>
                    <button type="button" class="btn" style="background: #e2e8f0; color: #4a5568; flex: 1;" onclick="closeAddModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

        function init() {
            const savedData = localStorage.getItem('resourceLibrary');
            if (savedData) {
                resources = JSON.parse(savedData);
            } else {
                resources = initialResources;
                saveToStorage();
            }

            populateCategorySelect();
            renderCategoryFilters();
            renderResources();
            updateStats();

            document.getElementById('searchInput').addEventListener('input', (e) => renderResources(e.target.value));
        }

        function populateCategorySelect() {
            const select = document.getElementById('category');
            select.innerHTML = '<option value="">Select a category</option>';
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                select.appendChild(option);
            });
        }

        function renderCategoryFilters() {
            const container = document.getElementById('categoryFilters');
            container.innerHTML = '<div class="category-chip active" onclick="filterByCategory(&#39;all&#39;)">All</div>';

            const usedCategories = [...new Set(resources.map(r => r.category))].sort();
            usedCategories.forEach(cat => {
                const chip = document.createElement('div');
                chip.className = 'category-chip';
                chip.textContent = cat;
                chip.onclick = () => filterByCategory(cat);
                container.appendChild(chip);
            });
        }

        function filterByCategory(category) {
            activeFilter = category;
            document.querySelectorAll('.category-chip').forEach(chip => chip.classList.toggle('active', (category === 'all' && chip.textContent === 'All') || chip.textContent === category));
            renderResources(document.getElementById('searchInput').value);
        }

        function renderResources(searchTerm = '') {
            const grid = document.getElementById('resourcesGrid');
            const emptyState = document.getElementById('emptyState');
            let filtered = resources;

            if (activeFilter !== 'all') filtered = filtered.filter(r => r.category === activeFilter);
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filtered = filtered.filter(r => r.title.toLowerCase().includes(term) || r.description.toLowerCase().includes(term) || r.category.toLowerCase().includes(term));
            }

            grid.style.display = filtered.length ? 'grid' : 'none';
            emptyState.style.display = filtered.length ? 'none' : 'block';
            grid.innerHTML = '';

            filtered.forEach(resource => {
                const card = document.createElement('div');
                card.className = 'resource-card';
                const linksHtml = resource.links.length ? resource.links.map(l => `<a href="${l}" target="_blank" rel="noopener" class="resource-link">${l}</a>`).join('') : '<em>No links yet</em>';
                card.innerHTML = `
                    <div class="resource-category">${resource.category}</div>
                    <div class="resource-title">${resource.title}</div>
                    <div class="resource-description">${resource.description || ''}</div>
                    <div class="resource-links">${linksHtml}</div>
                `;
                grid.appendChild(card);
            });
        }

        function updateStats() {
            document.getElementById('totalResources').textContent = resources.length;
            document.getElementById('totalCategories').textContent = new Set(resources.map(r => r.category)).size;
        }

        function openAddModal() {
            document.getElementById('addModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('active');
            document.body.style.overflow = 'auto';
            document.getElementById('resourceForm').reset();
            document.getElementById('linksContainer').innerHTML = `<div class="link-input-group"><input type="url" placeholder="https://example.com" class="link-input"><button type="button" class="btn btn-danger btn-small" onclick="removeLink(this)">Remove</button></div>`;
        }

        function addLinkField() {
            const container = document.getElementById('linksContainer');
            const group = document.createElement('div');
            group.className = 'link-input-group';
            group.innerHTML = `<input type="url" placeholder="https://example.com" class="link-input"><button type="button" class="btn btn-danger btn-small" onclick="removeLink(this)">Remove</button>`;
            container.appendChild(group);
        }

        function removeLink(btn) {
            if (document.querySelectorAll('.link-input-group').length > 1) btn.parentElement.remove();
        }

        function saveResource(e) {
            e.preventDefault();
            const category = document.getElementById('category').value;
            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const links = Array.from(document.querySelectorAll('.link-input')).map(i => i.value.trim()).filter(l => l);

            resources.unshift({category, title, description, links});
            saveToStorage();
            renderCategoryFilters();
            renderResources();
            updateStats();
            closeAddModal();
        }

        function saveToStorage() {
            localStorage.setItem('resourceLibrary', JSON.stringify(resources));
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(resources, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `resource-library-${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (confirm(`Import ${data.length} resources? This will replace current data.`)) {
                        resources = data;
                        saveToStorage();
                        renderCategoryFilters();
                        renderResources();
                        updateStats();
                    }
                } catch {
                    alert('Invalid JSON file');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        init();
    </script>
