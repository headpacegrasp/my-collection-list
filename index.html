            <button onclick="addNewTool()" class="mt-4 w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition"> Add to Live View </button>

        // Generate category filter buttons
        const categories = [...new Set(toolsData.map(tool => tool.category))].sort();
        const filterBar = document.getElementById('filterBar');
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.textContent = cat;
            btn.className = 'filter-btn px-5 py-2 rounded-full border bg-white font-semibold transition';
            btn.onclick = function() { filterBy(cat, this); };
            filterBar.appendChild(btn);
        });

        // Render tools
        function renderTools(data) {
            const grid = document.getElementById('toolGrid');
            grid.innerHTML = '';
            data.forEach(tool => {
                const card = document.createElement('div');
                card.className = 'tool-card bg-white rounded-2xl shadow-md p-6 border border-gray-200 transition cursor-pointer';
                card.onclick = () => window.open(tool.link, '_blank');
                card.innerHTML = `
                    <h3 class="text-lg font-bold text-indigo-700 mb-2">${tool.name}</h3>
                    <p class="text-sm text-gray-600 mb-4">${tool.category}</p>
                    <a href="${tool.link}" target="_blank" class="text-indigo-500 text-sm hover:underline truncate block">${tool.link}</a>
                `;
                grid.appendChild(card);
            });
        }

        // Filter by category
        function filterBy(category, element) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active-cat'));
            element.classList.add('active-cat');
            if (category === 'All') {
                renderTools(toolsData);
            } else {
                renderTools(toolsData.filter(tool => tool.category === category));
            }
        }

        // Search
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            const filtered = toolsData.filter(tool => 
                tool.name.toLowerCase().includes(query) ||
                tool.category.toLowerCase().includes(query) ||
                tool.link.toLowerCase().includes(query)
            );
            renderTools(filtered);
        });

        // Add new tool
        function addNewTool() {
            const name = document.getElementById('newName').value.trim();
            const category = document.getElementById('newCategory').value;
            const link = document.getElementById('newLink').value.trim();

            if (name && category && link) {
                toolsData.push({ name, category, link });
                renderTools(toolsData);
                document.getElementById('newName').value = '';
                document.getElementById('newLink').value = '';
                document.getElementById('addFormContainer').classList.add('hidden');
                alert('Tool added successfully (live view only)');
            } else {
                alert('Please fill all fields');
            }
        }

        // Initial render
        renderTools(toolsData);
    </script>
